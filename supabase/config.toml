project_id = "tarot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local development only: skip the confirmation round trip.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.agent]
# The browser sends a Supabase JWT and the runtime verifies it itself, so the
# platform-level check stays on.
verify_jwt = true
