name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: deno check --config supabase/functions/deno.json --no-lock supabase/functions/agent/index.ts supabase/functions/kb-embed/index.ts
      - run: npm run test:functions
      - run: npm run check:readings

  e2e:
    name: E2E (Chromium + WebKit, light + dark)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - run: npx playwright install --with-deps chromium webkit
      # Bộ đầy đủ chạy 5 thiết bị; trên CI giữ desktop (Chromium) và iPhone
      # (WebKit) — hai engine, hai cỡ màn hình — cho vừa thời gian.
      - run: npx playwright test --project=setup --project=desktop --project=iphone
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
