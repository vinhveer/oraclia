    <script>
      // Đặt chế độ màu trước lần vẽ đầu, để không nháy trắng khi mở ở chế độ tối.
      try {
        var key = 'oraclia.color-scheme'
        var stored = localStorage.getItem(key)
        if (!stored) {
          // Chuyển lựa chọn từ khoá cũ của bản Material 3.
          var legacy = localStorage.getItem('md3.mode')
          if (legacy === 'light' || legacy === 'dark') {
            stored = legacy
            localStorage.setItem(key, legacy)
          }
        }
        var scheme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        var root = document.documentElement
        // Astryx đọc data-theme (color-scheme cho light-dark()) và data-astryx-theme
        // (CSS của theme); đặt sẵn để lần vẽ đầu đã đúng nền và đúng màu nhấn.
        root.setAttribute('data-theme', scheme)
        root.setAttribute('data-astryx-theme', 'neutral')
        var palette = localStorage.getItem('oraclia.palette')
        if (palette) root.setAttribute('data-palette', palette)
        document.documentElement.style.background = scheme === 'dark' ? '#141218' : '#fdfbfe'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', scheme === 'dark' ? '#141218' : '#fdfbfe')
      } catch (error) {}
    </script>
