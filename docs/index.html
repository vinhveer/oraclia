    <script>
      // Apply the stored scheme before first paint so there is no light flash.
      try {
        const stored = localStorage.getItem('md3.mode')
        const dark =
          stored === 'dark' ||
          (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
